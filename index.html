<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de solución nutritiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
  --agua:#14200f;
  --panel:#1e2e18;
  --linea:#3a5230;
  --tinta:#eef3e6;
  --tenue:#9fb28f;
  --negro:#a3d977;
  --ambar:#e0a83c;
  --coral:#d4674a;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--agua);
    color:var(--tinta);
    font-family:Inter,system-ui,sans-serif;
    line-height:1.55;
    padding:2rem 1.25rem 4rem;
  }
  .envoltura{max-width:60rem;margin:0 auto}

  header{
    display:flex;flex-wrap:wrap;gap:1rem;
    align-items:flex-end;justify-content:space-between;
    padding-bottom:1.25rem;border-bottom:1px solid var(--linea);
  }
  h1{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:1.6rem;letter-spacing:-.02em;margin:0}
  header p{margin:.2rem 0 0;color:var(--tenue);font-size:.9rem}

  .estado{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--tenue)}
  .punto{width:.55rem;height:.55rem;border-radius:50%;background:var(--tenue)}
  .punto.viva{background:var(--musgo)}
  .punto.dormida{background:var(--ambar)}
  .punto.caida{background:var(--coral)}

  /* --- Lecturas --- */
  .lecturas{
    display:grid;gap:1px;background:var(--linea);
    border:1px solid var(--linea);margin:2rem 0;
    grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));
  }
  .lectura{background:var(--panel);padding:1.5rem 1.4rem}
  .lectura h2{margin:0;font-size:.9rem;font-weight:500;color:var(--tenue)}
  .valor{
    font-family:'Space Grotesk',sans-serif;
    font-size:3.4rem;font-weight:500;line-height:1;
    letter-spacing:-.03em;margin:.6rem 0 .1rem;
    font-variant-numeric:tabular-nums;
  }
  .valor span{font-size:1.1rem;color:var(--tenue);margin-left:.25rem}
  .juicio{font-size:.85rem;margin:.5rem 0 0;min-height:1.3em}
  .juicio.ok{color:var(--musgo)}
  .juicio.alerta{color:var(--ambar)}
  .juicio.mala{color:var(--coral)}

  .barra{position:relative;height:.4rem;background:#0a2b36;margin-top:1rem}
  .banda{position:absolute;top:0;bottom:0;background:rgba(121,214,172,.28)}
  .aguja{position:absolute;top:-.25rem;bottom:-.25rem;width:2px;background:var(--tinta);transition:left .4s ease}
  .limites{display:flex;justify-content:space-between;font-size:.72rem;color:var(--tenue);margin-top:.35rem}

  /* --- Actuadores --- */
  .control{border:1px solid var(--linea);padding:1.25rem 1.4rem;margin-bottom:2rem}
  .control h2{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:500;margin:0 0 .3rem}
  .control .nota{color:var(--tenue);font-size:.85rem;margin:0 0 1rem}
  .mandos{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr))}
  .mando{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    background:var(--panel);border:1px solid var(--linea);padding:.8rem 1rem;
  }
  .mando .nombre{font-size:.95rem}
  .mando .confirma{display:block;font-size:.72rem;color:var(--tenue);margin-top:.15rem}
  .mando .confirma.si{color:var(--musgo)}
  .interruptor{
    position:relative;width:2.8rem;height:1.5rem;flex:none;
    background:#0a2b36;border:1px solid var(--linea);cursor:pointer;
  }
  .interruptor::after{
    content:'';position:absolute;top:.2rem;left:.2rem;
    width:1rem;height:1rem;background:var(--tenue);transition:transform .2s,background .2s;
  }
  .interruptor[aria-checked="true"]{border-color:var(--musgo)}
  .interruptor[aria-checked="true"]::after{transform:translateX(1.25rem);background:var(--musgo)}
  .interruptor[hidden]{display:none}

  /* --- Acceso --- */
  .acceso{border:1px solid var(--linea);padding:1.5rem 1.4rem;margin-bottom:2rem}
  .acceso h2{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:500;margin:0 0 .4rem}
  .acceso p{margin:0 0 1rem;color:var(--tenue);font-size:.9rem}
  .campo{display:flex;flex-wrap:wrap;gap:.6rem}
  .campo input{
    background:var(--agua);border:1px solid var(--linea);color:var(--tinta);
    padding:.55rem .7rem;font:inherit;font-size:.9rem;flex:1 1 12rem;
  }
  .campo button{
    background:var(--musgo);border:0;color:#06222b;
    padding:.55rem 1.3rem;font:inherit;font-weight:500;cursor:pointer;
  }
  .campo button:hover{background:#95e5c1}
  .errorLogin{color:var(--coral);font-size:.85rem;margin:.9rem 0 0}

  .aviso{border:1px solid var(--linea);padding:1rem 1.25rem;color:var(--ambar);font-size:.9rem}
  footer{color:var(--tenue);font-size:.8rem;margin-top:2rem;
    display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between}
  .enlace{background:none;border:0;color:var(--tenue);font:inherit;font-size:.8rem;
    text-decoration:underline;cursor:pointer;padding:0}
  .enlace:hover{color:var(--tinta)}
  input:focus-visible,button:focus-visible{outline:2px solid var(--musgo);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.aguja,.interruptor::after{transition:none}}
</style>
</head>
<body>
<div class="envoltura">

  <header>
    <div>
      <h1>Monitor de solución nutritiva</h1>
      <p>Lecturas en vivo del ESP32</p>
    </div>
    <div class="estado">
      <span class="punto" id="punto"></span>
      <span id="estadoTexto">Conectando…</span>
    </div>
  </header>

  <section class="lecturas" id="lecturas"></section>

  <section class="control">
    <h2>Actuadores</h2>
    <p class="nota" id="notaControl">Estado informado por la placa.</p>
    <div class="mandos" id="mandos"></div>
  </section>

  <section class="acceso" id="acceso" hidden>
    <h2>Acceso de control</h2>
    <p>Solo para operar los actuadores. Las lecturas se ven sin entrar.</p>
    <div class="campo">
      <input id="correo" type="email" placeholder="correo" autocomplete="username">
      <input id="clave" type="password" placeholder="contraseña" autocomplete="current-password">
      <button id="entrar">Entrar</button>
    </div>
    <p class="errorLogin" id="errorLogin" hidden></p>
  </section>

  <p class="aviso" id="aviso" hidden></p>

  <footer>
    <span id="ultima">Todavía sin datos</span>
    <button id="sesion" class="enlace">Entrar</button>
  </footer>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import { getDatabase, ref, onValue, update } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js';

// ---------- Configuración ----------
const firebaseConfig = {
  apiKey: "AIzaSyDa0fTMGfNUCwrVBRXfpz9QZP5B-RMVYuA",
  authDomain: "tp21-27428.firebaseapp.com",
  databaseURL: "https://tp21-27428-default-rtdb.firebaseio.com",
  projectId: "tp21-27428",
  appId: "1:250329368925:web:98d43dfb2463c9991500b4"
};

const RUTA = 'cultivo/actual';
const SIN_SENAL = 120000;

const SENSORES = [
  { clave:'ph',   titulo:'pH',            unidad:'',      decimales:2, min:3,  max:9,   sanoMin:5.5, sanoMax:6.5 },
  { clave:'ec',   titulo:'Conductividad', unidad:'mS/cm', decimales:2, min:0,  max:3.5, sanoMin:1.2, sanoMax:2.2 },
  { clave:'temp', titulo:'Temperatura',   unidad:'°C',    decimales:1, min:10, max:35,  sanoMin:18,  sanoMax:26 }
];

const ACTUADORES = [
  { clave:'bomba',       titulo:'Bomba de agua' },
  { clave:'extractor_1', titulo:'Extractor 1' },
  { clave:'extractor_2', titulo:'Extractor 2' },
  { clave:'rele_4',      titulo:'Reserva' }
];

// ---------- Interfaz ----------
const pct = (s, v) => Math.max(0, Math.min(100, ((v - s.min) / (s.max - s.min)) * 100));

document.getElementById('lecturas').innerHTML = SENSORES.map(s => `
  <article class="lectura">
    <h2>${s.titulo}</h2>
    <p class="valor"><span data-valor="${s.clave}">—</span><span>${s.unidad}</span></p>
    <div class="barra">
      <div class="banda" style="left:${pct(s,s.sanoMin)}%;width:${pct(s,s.sanoMax)-pct(s,s.sanoMin)}%"></div>
      <div class="aguja" data-aguja="${s.clave}" style="left:0;visibility:hidden"></div>
    </div>
    <div class="limites"><span>${s.min}</span><span>${s.max}</span></div>
    <p class="juicio" data-juicio="${s.clave}"></p>
  </article>
`).join('');

document.getElementById('mandos').innerHTML = ACTUADORES.map(a => `
  <div class="mando">
    <span>
      <span class="nombre">${a.titulo}</span>
      <span class="confirma" data-confirma="${a.clave}">sin datos</span>
    </span>
    <button class="interruptor" data-mando="${a.clave}" role="switch"
            aria-checked="false" aria-label="${a.titulo}" hidden></button>
  </div>
`).join('');

function pintar(datos){
  for (const s of SENSORES){
    const v = Number(datos?.[s.clave]);
    const celda  = document.querySelector(`[data-valor="${s.clave}"]`);
    const aguja  = document.querySelector(`[data-aguja="${s.clave}"]`);
    const juicio = document.querySelector(`[data-juicio="${s.clave}"]`);

    if (!Number.isFinite(v) || v < 0){
      celda.textContent = '—'; aguja.style.visibility = 'hidden'; juicio.textContent = '';
      continue;
    }

    celda.textContent = v.toFixed(s.decimales);
    aguja.style.left = pct(s, v) + '%';
    aguja.style.visibility = 'visible';

    if (s.clave === 'temp' && datos.tempOk === false){
      juicio.className = 'juicio alerta';
      juicio.textContent = 'El DHT22 no responde: valor por defecto';
      continue;
    }

    const margen = (s.sanoMax - s.sanoMin) * 0.5;
    if (v >= s.sanoMin && v <= s.sanoMax){
      juicio.className = 'juicio ok';
      juicio.textContent = `Dentro del rango ${s.sanoMin}–${s.sanoMax}`;
    } else if (v >= s.sanoMin - margen && v <= s.sanoMax + margen){
      juicio.className = 'juicio alerta';
      juicio.textContent = v < s.sanoMin ? 'Un poco bajo' : 'Un poco alto';
    } else {
      juicio.className = 'juicio mala';
      juicio.textContent = v < s.sanoMin ? 'Muy por debajo del rango' : 'Muy por encima del rango';
    }
  }
}

function pintarActuadores(datos){
  for (const a of ACTUADORES){
    const etiqueta = document.querySelector(`[data-confirma="${a.clave}"]`);
    const real = datos.actuadores?.[a.clave];
    etiqueta.textContent = real === undefined
      ? 'sin datos'
      : (real ? 'encendido' : 'apagado');
    etiqueta.className = 'confirma' + (real ? ' si' : '');

    // Si no hay sesión, el interruptor está oculto y reflejamos el estado real.
    const boton = document.querySelector(`[data-mando="${a.clave}"]`);
    if (boton.hidden && real !== undefined){
      boton.setAttribute('aria-checked', String(real === true));
    }
  }
}

function marcarEstado(clase, texto){
  document.getElementById('punto').className = 'punto ' + clase;
  document.getElementById('estadoTexto').textContent = texto;
}

function mostrarAviso(texto){
  const aviso = document.getElementById('aviso');
  aviso.hidden = !texto;
  aviso.textContent = texto || '';
}

let ultimoTs = 0;
function refrescarAntiguedad(){
  if (!ultimoTs) return;
  const edad = Date.now() - ultimoTs;
  document.getElementById('ultima').textContent =
    'Última lectura a las ' + new Date(ultimoTs).toLocaleTimeString('es-CL');

  if (edad > SIN_SENAL){
    marcarEstado('dormida', `Sin datos nuevos hace ${Math.round(edad / 60000)} min`);
  } else {
    marcarEstado('viva', 'Recibiendo datos');
  }
}
setInterval(refrescarAntiguedad, 10000);

// ---------- Firebase ----------
const app  = initializeApp(firebaseConfig);
const db   = getDatabase(app);
const auth = getAuth(app);

// Lecturas: públicas, se escuchan desde el arranque y sin sesión.
onValue(ref(db, RUTA),
  instantanea => {
    const datos = instantanea.val();
    if (!datos){
      marcarEstado('caida', 'Base vacía');
      mostrarAviso(`No hay nada en /${RUTA}. Revisa que el ESP32 esté escribiendo.`);
      return;
    }
    mostrarAviso('');
    pintar(datos);
    pintarActuadores(datos);
    ultimoTs = datos.ts ?? Date.now();
    refrescarAntiguedad();
  },
  error => {
    marcarEstado('caida', 'Lectura rechazada');
    mostrarAviso('La base rechazó la lectura: revisa las reglas de seguridad. ' + error.message);
  }
);

// ---------- Modo control ----------
const acceso     = document.getElementById('acceso');
const botonSesion = document.getElementById('sesion');
const errorLogin = document.getElementById('errorLogin');
let cortarControl = null;   // para dejar de escuchar al cerrar sesión

function escucharControl(){
  cortarControl = onValue(ref(db, 'cultivo/control'), instantanea => {
    const ordenes = instantanea.val() || {};
    for (const a of ACTUADORES){
      const boton = document.querySelector(`[data-mando="${a.clave}"]`);
      if (document.activeElement !== boton){
        boton.setAttribute('aria-checked', String(ordenes[a.clave] === true));
      }
    }
  });
}

onAuthStateChanged(auth, usuario => {
  const admin = !!usuario;

  document.querySelectorAll('[data-mando]').forEach(b => { b.hidden = !admin; });
  document.getElementById('notaControl').textContent = admin
    ? 'La placa aplica las órdenes en unos 5 segundos.'
    : 'Estado informado por la placa. Entra para poder operarlos.';

  botonSesion.textContent = admin ? 'Cerrar sesión' : 'Entrar';
  acceso.hidden = true;

  if (admin){
    escucharControl();
  } else if (cortarControl){
    cortarControl();
    cortarControl = null;
  }
});

botonSesion.addEventListener('click', () => {
  if (botonSesion.textContent === 'Cerrar sesión'){
    signOut(auth);
  } else {
    acceso.hidden = !acceso.hidden;
    if (!acceso.hidden) document.getElementById('correo').focus();
  }
});

document.getElementById('entrar').addEventListener('click', async () => {
  errorLogin.hidden = true;
  try {
    await signInWithEmailAndPassword(
      auth,
      document.getElementById('correo').value.trim(),
      document.getElementById('clave').value
    );
    document.getElementById('clave').value = '';
  } catch (e) {
    errorLogin.hidden = false;
    errorLogin.textContent = e.code === 'auth/invalid-credential'
      ? 'Correo o contraseña incorrectos.'
      : 'No se pudo entrar: ' + e.code;
  }
});

document.getElementById('clave').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('entrar').click();
});

// ---------- Envío de órdenes ----------
document.querySelectorAll('[data-mando]').forEach(boton => {
  boton.addEventListener('click', async () => {
    const clave = boton.dataset.mando;
    const nuevo = boton.getAttribute('aria-checked') !== 'true';
    boton.setAttribute('aria-checked', String(nuevo));
    try {
      await update(ref(db, 'cultivo/control'), { [clave]: nuevo });
    } catch (e) {
      boton.setAttribute('aria-checked', String(!nuevo));
      mostrarAviso('No se pudo enviar la orden: ' + e.message);
    }
  });
});
</script>
</body>
</html>
